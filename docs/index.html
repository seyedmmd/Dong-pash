<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دنگ‌پاش">
<title>دنگ‌پاش</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   Design tokens
   ========================================================== */
:root{
  --f-body:"Vazirmatn","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
  --f-display:"Noto Kufi Arabic","Vazirmatn","Segoe UI",Tahoma,sans-serif;
  --f-num:"Space Grotesk","Vazirmatn",system-ui,sans-serif;
  --r:16px; --r-sm:11px;
  --sp:cubic-bezier(.34,1.42,.5,1);
  --ez:cubic-bezier(.22,1,.36,1);
}
html[lang="en"]{
  --f-body:"Vazirmatn","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-display:"Space Grotesk","Vazirmatn",system-ui,sans-serif;
}
html[data-theme="light"]{
  --bg:#EBEEF3; --bg2:#E3E8EF;
  --card:#FFFFFF; --surf:#F5F7FA; --surf2:#EAEEF3;
  --line:#DCE2EA; --line2:#E9EDF2;
  --ink:#111C2B; --ink2:#2A3B52; --muted:#6B7A8D;
  --teal:#0C7C72; --teal-2:#12988C; --teal-soft:#DFF1EF;
  --rust:#C0453B; --rust-soft:#FBE6E3;
  --gold:#D79A2B; --gold-2:#F5C86A;
  --onDark:#FFFFFF;
  --panel:#111C2B; --panelInk:#FFFFFF;
  --shadow:0 1px 2px rgba(17,28,43,.05), 0 8px 24px -14px rgba(17,28,43,.28);
  --shadow-lg:0 2px 6px rgba(17,28,43,.06), 0 22px 48px -22px rgba(17,28,43,.38);
  --aurora1:#0C7C72; --aurora2:#2D5F9A; --aurora3:#D79A2B;
}
html[data-theme="dark"]{
  --bg:#0B121C; --bg2:#0F1926;
  --card:#141F2E; --surf:#1A2637; --surf2:#212F42;
  --line:#26344799; --line2:#22303F;
  --ink:#EAF0F7; --ink2:#C2CEDC; --muted:#8296AC;
  --teal:#2FBFAE; --teal-2:#3FD6C2; --teal-soft:#123A38;
  --rust:#F2776B; --rust-soft:#3B1E1C;
  --gold:#E8B04B; --gold-2:#FBD98A;
  --onDark:#FFFFFF;
  --panel:#1B2A3E; --panelInk:#EAF0F7;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.8);
  --shadow-lg:0 2px 8px rgba(0,0,0,.35), 0 26px 54px -24px rgba(0,0,0,.9);
  --aurora1:#0C7C72; --aurora2:#2C4E8A; --aurora3:#8A6A1E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body);
  font-size:15px; line-height:1.7; font-variant-numeric:tabular-nums;
  transition:background .45s var(--ez), color .45s var(--ez);
  overflow-x:hidden;
}
h1,h2,h3,.disp{font-family:var(--f-display)}
.num{font-family:var(--f-num);font-weight:700;letter-spacing:-.3px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:780px;margin:0 auto;padding:0 15px calc(96px + env(safe-area-inset-bottom));position:relative;z-index:1}
.hidden{display:none!important}

/* ==========================================================
   Animated aurora background
   ========================================================== */
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.5;filter:blur(64px)}
html[data-theme="dark"] #aurora{opacity:.42}
#aurora i{position:absolute;border-radius:50%;display:block;will-change:transform}
#aurora i:nth-child(1){width:60vw;height:60vw;background:var(--aurora1);top:-22vw;inset-inline-end:-16vw;animation:float1 22s ease-in-out infinite}
#aurora i:nth-child(2){width:48vw;height:48vw;background:var(--aurora2);top:24vh;inset-inline-start:-18vw;animation:float2 27s ease-in-out infinite}
#aurora i:nth-child(3){width:40vw;height:40vw;background:var(--aurora3);bottom:-14vw;inset-inline-end:-8vw;animation:float3 31s ease-in-out infinite;opacity:.7}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-6vw,7vh) scale(1.14)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8vw,-6vh) scale(.88)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5vw,-8vh) scale(1.2)}}

/* ==========================================================
   Base animations
   ========================================================== */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes riseSm{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.86)}62%{transform:scale(1.045)}100%{opacity:1;transform:scale(1)}}
@keyframes popIn{0%{opacity:0;transform:scale(.4) rotate(-14deg)}70%{transform:scale(1.09) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes slideFrom{from{opacity:0;transform:translateX(var(--from,26px))}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes dashRun{to{background-position-x:var(--dashdir,-30px)}}
@keyframes sheen{to{background-position:200% 0}}
@keyframes drop{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}
  16%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot))}}
@keyframes shakeIt{0%,70%,100%{transform:rotate(0)}77%{transform:rotate(-15deg)}85%{transform:rotate(11deg)}92%{transform:rotate(-5deg)}}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
@keyframes spinIn{from{opacity:0;transform:rotate(-160deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position-x:-200%}}
@keyframes pulseRing{0%{transform:scale(.85);opacity:.65}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes glowBeat{0%,100%{filter:drop-shadow(0 0 2px rgba(215,154,43,.4))}50%{filter:drop-shadow(0 0 10px rgba(215,154,43,.9))}}

.stagger>*{animation:rise .5s var(--ez) both;animation-delay:calc(var(--i,0) * 55ms)}
.reveal{opacity:0}
.reveal.seen{animation:rise .55s var(--ez) both}
.pop-in{animation:pop .36s var(--sp) both}
.enter{animation:rise .34s var(--ez) both}

/* Touch ripple */
.btn,.trip,.chip,.iconbtn{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;
  transform:scale(0);animation:ripple .62s var(--ez) forwards;pointer-events:none}

/* ==========================================================
   Base components
   ========================================================== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:17px;margin-bottom:13px;
  transition:background .45s var(--ez),box-shadow .3s,transform .2s var(--sp)}
.card h2,h2.sechead{margin:0 0 13px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px;letter-spacing:-.2px}
h2.sechead{margin:20px 3px 10px}
.card h2 .rule,h2.sechead .rule{flex:1;height:1px;background:var(--line)}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--surf);outline:none;transition:.2s var(--ez);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--teal);background:var(--card);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 16%,transparent);transform:translateY(-1px)}
input.err{border-color:var(--rust)}
.row{display:flex;gap:10px}.row>*{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.amount-in{font-family:var(--f-num);font-weight:700;font-size:18px}
.note{font-size:12.5px;color:var(--muted);background:var(--surf);border-radius:12px;padding:11px 13px;margin-top:11px;line-height:1.75}

.btn{padding:12px 17px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .16s var(--sp),background .2s,box-shadow .2s,color .2s;font-size:14px}
.btn:hover{box-shadow:0 6px 18px -8px color-mix(in srgb,var(--ink) 60%,transparent)}
.btn:active{transform:scale(.955)}
.btn.teal{background:var(--teal);color:#fff}
.btn.teal:hover{box-shadow:0 8px 22px -8px color-mix(in srgb,var(--teal) 75%,transparent)}
.btn.ghost{background:var(--surf2);color:var(--ink)}
.btn.line{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.line:hover{border-color:var(--teal);color:var(--teal)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.danger{color:var(--rust)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surf2);
  color:var(--ink);flex:none;transition:transform .18s var(--sp),background .2s}
.iconbtn:active{transform:scale(.9)}
.x{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:18px;flex:none;transition:.18s var(--sp)}
.x:hover{background:var(--surf2);color:var(--rust);transform:rotate(90deg)}
.tag{display:inline-block;background:var(--surf2);border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.tag.pay{background:var(--teal-soft);color:var(--teal)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.4;animation:bob 3s ease-in-out infinite}
.empty b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:5px}

/* ==========================================================
   Top bar: language and theme
   ========================================================== */
.topbar{display:flex;align-items:center;gap:8px;padding:14px 0 0;justify-content:flex-end}
.seg-mini{display:flex;background:var(--surf2);border-radius:11px;padding:3px;gap:2px}
.seg-mini button{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:800;color:var(--muted);
  transition:.22s var(--ez);font-family:var(--f-display)}
.seg-mini button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.themebtn svg{width:19px;height:19px;transition:transform .5s var(--sp)}
.themebtn:active svg{transform:rotate(180deg)}

.credit{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 6px;
  color:var(--muted);font-size:12px;opacity:.75;transition:opacity .25s}
.credit:hover{opacity:1}
.credit a{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;color:var(--muted);
  background:var(--surf2);transition:transform .22s var(--sp),background .25s,color .25s}
.credit a:hover{transform:translateY(-2px) scale(1.06);background:var(--ink);color:var(--bg)}
.credit a:active{transform:scale(.92)}
.credit a svg{width:19px;height:19px}
/* ==========================================================
   Logo
   ========================================================== */
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1.2}
html[lang="en"] .brand h1{letter-spacing:-1.4px}
.brand h1 .ac{color:var(--teal)}
.brand small{color:var(--muted);font-size:12.5px;font-weight:500}
.logomark{width:44px;height:44px;flex:none;display:block;transform-origin:62% 30%;
  animation:shakeIt 5s ease-in-out 1s infinite}
.logomark .lc{animation:drop 2s cubic-bezier(.4,0,.7,1) infinite}
header.top{padding:10px 0 16px}
.tagline{color:var(--muted);font-size:13px;margin-top:6px}

/* ==========================================================
   Trip card
   ========================================================== */
.trip{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:var(--r);
  box-shadow:var(--shadow);padding:13px;margin-bottom:11px;text-align:start;width:100%;
  transition:transform .2s var(--sp),box-shadow .25s}
.trip:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.trip:active{transform:scale(.985)}
.trip .cover{width:54px;height:54px;border-radius:15px;flex:none;overflow:hidden;position:relative;
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;font-family:var(--f-display)}
.trip .cover img{width:100%;height:100%;object-fit:cover;display:block}
.trip .body{flex:1;min-width:0}
.trip .nm{font-weight:700;font-size:16px;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-display)}
.trip .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.trip .faces{display:flex;margin-top:7px}
.trip .faces>*{width:24px;height:24px;border-radius:50%;margin-inline-end:-7px;border:2px solid var(--card);overflow:hidden;flex:none}
.trip .chev{color:var(--muted);flex:none;transition:transform .25s var(--sp);opacity:.5}
html[dir="rtl"] .trip .chev svg{transform:scaleX(-1)}
bdi{unicode-bidi:isolate}
.trip:hover .chev{transform:translateX(var(--chev,-4px))}
html[dir="ltr"] .trip{--chev:4px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 9px;margin-inline-start:7px;vertical-align:middle}
.pill.open{background:var(--rust-soft);color:var(--rust)}
.pill.done{background:var(--teal-soft);color:var(--teal)}

/* ==========================================================
   Trip header and tabs
   ========================================================== */
.tripbar{display:flex;align-items:center;gap:11px;padding:8px 0 12px}
.tripbar .cover{width:44px;height:44px;border-radius:13px;flex:none;overflow:hidden;display:grid;place-items:center;
  color:#fff;font-weight:800;font-family:var(--f-display)}
.tripbar .cover img{width:100%;height:100%;object-fit:cover}
.tripbar .t{flex:1;min-width:0}
.tripbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tripbar .s{font-size:12.5px;color:var(--muted)}
.back svg{width:19px;height:19px}
html[dir="ltr"] .back svg{transform:scaleX(-1)}

nav.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surf2);
  border-radius:14px;padding:4px;margin:2px 0 18px}
nav.tabs .ind{position:absolute;top:4px;bottom:4px;width:calc((100% - 8px)/3);background:var(--card);
  border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.13);transition:transform .42s var(--sp);z-index:0}
nav.tabs button{position:relative;z-index:1;padding:10px 6px;border-radius:11px;font-weight:700;font-size:13.5px;
  color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .3s;font-family:var(--f-display)}
nav.tabs button.on{color:var(--ink)}
nav.tabs .badge{background:var(--surf);color:var(--muted);border-radius:20px;font-size:11px;
  min-width:20px;padding:0 6px;line-height:20px;font-weight:800;transition:.3s}
nav.tabs button.on .badge{background:var(--teal);color:#fff}

/* ==========================================================
   Avatars
   ========================================================== */
.av{border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;position:relative;
  background:var(--surf2);width:38px;height:38px}
.av svg,.av img{width:100%;height:100%;display:block;object-fit:cover}
.av.s{width:28px;height:28px}
.av.l{width:60px;height:60px}
.av.xl{width:82px;height:82px}
.avpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:9px;max-height:262px;overflow-y:auto;padding:3px}
.avpick button{border-radius:50%;overflow:hidden;aspect-ratio:1;border:3px solid transparent;transition:.2s var(--sp);background:var(--surf)}
.avpick button:hover{transform:scale(1.09)}
.avpick button.on{border-color:var(--teal);transform:scale(1.06)}
.avpick svg{width:100%;height:100%;display:block}

/* ==========================================================
   People / chips / split rows
   ========================================================== */
.plist{display:flex;flex-direction:column;gap:9px}
.plist>*{animation:riseSm .42s var(--ez) both;animation-delay:calc(var(--i,0) * 45ms)}
.prow{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--surf);border-radius:14px;
  transition:transform .2s var(--sp),background .2s}
.prow:hover{transform:translateX(var(--nudge,-3px));background:var(--surf2)}
html[dir="ltr"] .prow{--nudge:3px}
.prow .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:end}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 13px 6px 6px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);
  font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;
  transition:transform .18s var(--sp),background .22s,border-color .22s,color .22s}
html[dir="ltr"] .chip{padding:6px 6px 6px 13px}
.chip .av{width:24px;height:24px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip:active{transform:scale(.93)}
.seg{display:flex;background:var(--surf2);border-radius:12px;padding:3px;gap:3px;position:relative}
.seg button{flex:1;padding:9px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);transition:.25s var(--ez)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 7px rgba(0,0,0,.12)}
.splitrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;animation:riseSm .3s var(--ez) both;
  animation-delay:calc(var(--i,0) * 35ms)}
.splitrow .nm{flex:1;font-size:13.5px;font-weight:600}
.splitrow input{width:132px;text-align:center;direction:ltr;padding:9px 10px;font-family:var(--f-num);font-weight:700}
.tally{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;
  padding:10px 12px;border-radius:11px;background:var(--surf);margin-top:9px;transition:.3s}
.tally.ok{background:var(--teal-soft);color:var(--teal)}
.tally.bad{background:var(--rust-soft);color:var(--rust)}

/* ==========================================================
   Expenses and filters
   ========================================================== */
.exp{border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;background:var(--card);
  animation:riseSm .4s var(--ez) both;animation-delay:calc(var(--i,0) * 38ms);
  transition:border-color .22s,box-shadow .22s,transform .2s var(--sp)}
.exp:hover{border-color:var(--teal);box-shadow:var(--shadow);transform:translateY(-2px)}
.exp .top{display:flex;align-items:flex-start;gap:11px}
.exp .ttl{flex:1;font-weight:700;min-width:0}
.exp .amt{font-family:var(--f-num);font-weight:700;font-size:16px;white-space:nowrap;direction:ltr}
.exp .sub{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:400}
.exp .acts{display:flex;gap:7px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.fbar{display:flex;gap:9px;align-items:center}
.fbar input{flex:1}
.fclear{width:36px;height:44px;display:grid;place-items:center;color:var(--muted);font-size:18px;flex:none}
.fadv{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);animation:riseSm .3s var(--ez) both}
.fadv .row{margin-bottom:10px}
.fadv select,.fadv input{padding:10px;font-size:13.5px}
.fsum{margin-top:12px;background:var(--surf);border-radius:13px;padding:12px 13px;transition:.3s}
.fsum .hl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;gap:8px}
.fsum .hl b{font-size:19px;direction:ltr;font-family:var(--f-num)}
.fsum .brk{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.fsum .brk span{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px 9px;font-size:11.5px;font-weight:600;
  animation:riseSm .3s var(--ez) both;animation-delay:calc(var(--i,0) * 30ms)}
.fsum .brk span i{font-style:normal;color:var(--muted);font-weight:500}
.filt-on{border-color:var(--teal)!important;color:var(--teal)!important}

/* ==========================================================
   Settlement
   ========================================================== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}
.stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:13px 9px;text-align:center;
  transition:transform .22s var(--sp)}
.stat:hover{transform:translateY(-3px)}
.stat .v{font-family:var(--f-num);font-weight:700;font-size:17px;direction:ltr;letter-spacing:-.5px}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}

.person{padding:13px 0;border-bottom:1px solid var(--line)}
.person:last-child{border:none}
.person .l1{display:flex;align-items:center;gap:11px}
.person .nm{flex:1;font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .net{text-align:end;direction:ltr;font-family:var(--f-num);font-weight:700;font-size:15px;white-space:nowrap}
html[dir="rtl"] .person .net{text-align:left}
.person .l2{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:7px;padding-inline-start:49px}
.person .l2 b{color:var(--ink2);font-weight:700;direction:ltr;display:inline-block;font-family:var(--f-num)}
.gauge{height:7px;margin-top:8px;margin-inline-start:49px;position:relative;background:var(--surf2);border-radius:5px;overflow:hidden}
.gauge::after{content:"";position:absolute;inset-inline-end:50%;top:0;bottom:0;width:1.5px;background:var(--line)}
.gauge i{position:absolute;top:0;bottom:0;border-radius:5px;animation:grow .9s var(--ez) both;animation-delay:.15s}
.neg{color:var(--rust)}.pos{color:var(--teal)}.zero{color:var(--muted)}

.head-count{background:var(--panel);color:var(--panelInk);border-radius:var(--r);padding:18px 20px;margin-bottom:13px;
  display:flex;align-items:center;gap:18px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.head-count::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.1) 45%,transparent 60%);
  background-size:200% 100%;animation:sheen 3s ease-in-out .5s}
.head-count .n{font-family:var(--f-num);font-size:46px;font-weight:700;line-height:1;letter-spacing:-3px}
.head-count .t{font-size:12.5px;line-height:1.65;opacity:.85}
.head-count .t b{display:block;font-size:15px;opacity:1;margin-bottom:3px;font-family:var(--f-display)}

/* --- Transfer card with the big arrow --- */
.tx{display:flex;flex-direction:column;gap:11px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:15px 16px 13px;margin-bottom:11px;position:relative;overflow:hidden;
  transition:transform .22s var(--sp),box-shadow .25s}
.tx:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tx::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;
  background:linear-gradient(var(--rust),var(--teal))}
.txmain{display:flex;align-items:center;gap:9px}
.tx .who{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:74px;text-align:center}
.tx .who .nm{font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tx .who .role{font-size:9.5px;font-weight:800;letter-spacing:.2px;text-transform:uppercase;opacity:.9}
.tx .who.from .role{color:var(--rust)}
.tx .who.to .role{color:var(--teal)}
.tx .who .av{position:relative;width:42px;height:42px}
.tx .who.to .av::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--teal);
  animation:pulseRing 2.4s var(--ez) infinite}
.bridge{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;position:relative}
.bridge .money{font-family:var(--f-num);font-weight:700;font-size:17px;direction:ltr;white-space:nowrap;margin-bottom:7px;letter-spacing:-.4px}
.flowline{width:100%;height:22px;position:relative;display:flex;align-items:center}
.flowline .track{flex:1;height:5px;border-radius:4px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(to var(--dashto,left),
    color-mix(in srgb,var(--teal) 55%,transparent) 0 9px,transparent 9px 17px);
  animation:dashRun 1.15s linear infinite}
.flowline .head{width:0;height:0;flex:none;margin-inline-start:-1px;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--teal) 55%,transparent));
  border-block:10px solid transparent;border-inline-start:15px solid var(--teal);border-inline-end:0}
.flowline .coin{position:absolute;top:50%;margin-top:-8px;inset-inline-start:0;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--gold-2),var(--gold));
  box-shadow:0 0 12px color-mix(in srgb,var(--gold) 80%,transparent);
  animation:coinRun 2.3s var(--ez) infinite;animation-delay:var(--cd,0s)}
@keyframes coinRun{0%{opacity:0;transform:translateX(0) scale(.4)}
  12%{opacity:1;transform:scale(1)}
  82%{opacity:1;transform:translateX(var(--run)) scale(1)}
  100%{opacity:0;transform:translateX(var(--run)) scale(.4)}}
.flowline .coin{--run:calc(100% - 26px)}
html[dir="rtl"] .flowline .coin{--run:calc(-100% + 26px)}
.tx .done{width:100%}

.celebrate{position:relative;height:0}
.celebrate b{position:absolute;top:0;inset-inline-start:50%;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--gold-2),var(--gold));
  animation:drop 2.1s cubic-bezier(.4,0,.7,1) both}

/* --- Plan editor --- */
.txrow{display:flex;align-items:center;gap:7px;margin-bottom:9px;
  animation:riseSm .3s var(--ez) both;animation-delay:calc(var(--i,0) * 32ms)}
.txrow select{flex:1;min-width:0;padding:10px 7px;font-size:13px;font-weight:600}
.txrow input{width:112px;flex:none;text-align:center;direction:ltr;padding:10px 6px;font-family:var(--f-num);font-weight:700;font-size:13.5px}
.txrow .ar{color:var(--muted);font-size:15px;flex:none;font-weight:800}
.check{margin-top:13px;border-radius:13px;padding:12px 13px;font-size:12.5px;animation:pop .3s var(--sp) both}
.check b{display:block;font-size:13.5px;margin-bottom:4px}
.check.ok{background:var(--teal-soft);color:var(--teal)}
.check.bad{background:var(--rust-soft);color:var(--rust)}
.check .brk{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.check .brk span{background:var(--card);border-radius:9px;padding:4px 9px;font-size:11.5px;font-weight:700}

/* ==========================================================
   Toast and bottom sheet
   ========================================================== */
.toast{position:fixed;inset-inline:16px;bottom:18px;max-width:420px;margin:0 auto;background:var(--panel);color:var(--panelInk);
  padding:13px 18px;border-radius:14px;font-size:13.5px;font-weight:600;text-align:center;
  opacity:0;transform:translateY(18px) scale(.95);transition:.34s var(--sp);pointer-events:none;z-index:90;
  box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:none}
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:flex;align-items:flex-end;justify-content:center;z-index:80;padding:0;
  animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet .box{background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  max-width:480px;width:100%;max-height:88vh;overflow-y:auto;animation:sheetUp .38s var(--ez) both}
@media(min-width:520px){
  .sheet{align-items:center;padding:18px}
  .sheet .box{border-radius:20px;padding-bottom:20px}
}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 14px}
.sheet h3{margin:0 0 14px;font-size:17px;font-family:var(--f-display)}

.skel{background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 37%,var(--surf) 63%);
  background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:9px;color:transparent}

@media(max-width:430px){
  .brand h1{font-size:23px}
  .person .l2{gap:11px;font-size:11px;padding-inline-start:0;margin-top:8px}
  .gauge{margin-inline-start:0}
  .stat .v{font-size:15px}
  .tx .who{width:27%}
  .tx .who .nm{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  #aurora{display:none}
}

/* ================= Print / PDF ================= */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff!important}
  .wrap,.toast,.sheet,#aurora{display:none!important}
  #printRoot{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#printRoot{font-size:11pt;color:#111C2B;font-family:var(--f-body);font-variant-numeric:tabular-nums}
#printRoot h1,#printRoot h2,table.pr th{font-family:var(--f-display)}
.pr-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2.5px solid #111C2B;padding-bottom:8px;margin-bottom:14px}
.pr-head h1{margin:0;font-size:19pt;font-weight:800;letter-spacing:-1px}
.pr-head .meta{font-size:9pt;color:#69788C;text-align:end;line-height:1.6}
.pr-stats{display:flex;gap:8px;margin-bottom:16px}
.pr-stat{flex:1;border:1px solid #DCE2EA;border-radius:8px;padding:8px 10px;text-align:center}
.pr-stat .v{font-size:13pt;font-weight:800;direction:ltr}
.pr-stat .l{font-size:8.5pt;color:#69788C}
#printRoot h2{font-size:12pt;margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid #DCE2EA;display:flex;align-items:center;gap:7px}
#printRoot h2 .num{background:#111C2B;color:#fff;width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-size:9pt}
table.pr{width:100%;border-collapse:collapse;font-size:9.5pt}
table.pr th{background:#111C2B;color:#fff;font-weight:700;padding:6px 8px;text-align:start;font-size:9pt}
table.pr th:not(:first-child){text-align:center}
table.pr td{border:1px solid #DCE2EA;padding:5px 8px}
table.pr td.n{text-align:center;direction:ltr}
table.pr tbody tr:nth-child(even){background:#F6F8FA}
table.pr tr.total td{background:#EDF0F4;font-weight:800;border-top:2px solid #111C2B}
.pr-red{color:#BE4238;font-weight:700}
.pr-green{color:#0C7C72;font-weight:700}
.pr-foot{break-inside:avoid;margin-top:14px;padding-top:8px;border-top:1px solid #DCE2EA;font-size:8.5pt;color:#69788C;display:flex;justify-content:space-between}
table.pr tr{break-inside:avoid}
.pr-note{font-size:8.5pt;color:#69788C;margin-top:5px}
</style>
</head>
<body>
<div id="aurora"><i></i><i></i><i></i></div>
<!-- ==================== صفحهٔ سفرها ==================== -->
<div class="wrap screen" id="screenTrips">
  <div class="topbar">
    <div class="seg-mini" id="langSeg">
      <button data-lang="fa">فا</button><button data-lang="en">EN</button>
    </div>
    <button class="iconbtn themebtn" id="themeBtn" aria-label="theme"></button>

  <header class="top">
    <div class="brand">

          <path d="M18 42 Q18 48 24 48 L34 48 Q40 48 40 42 L37 20 Q36 15 32 15 L26 15 Q22 15 21 20 Z" fill="#F4F1E9" stroke="#D8D2C4" stroke-width="1"/>
          <path d="M20 34 L38 34 L38.4 39 L19.6 39 Z" fill="#0C7C72" opacity="0.16"/>

  <div id="tripList"></div>

  <div class="card">

  <div class="topbar">
    <div class="seg-mini" id="langSeg2">
      <button data-lang="fa">فا</button><button data-lang="en">EN</button>

  <nav class="tabs">
    <div class="ind" id="tabInd"></div>
    <button data-tab="people" class="on"><span id="l_tabPeople"></span> <span class="badge" id="cPeople">۰</span></button>

    <button data-tab="settle"><span id="l_tabSettle"></span></button>
  </nav>

  <!-- ---- افراد ---- -->
  <section id="tab-people">
    <div class="card">
      <h2><span id="l_addPerson"></span> <span class="rule"></span></h2>
      <div class="row">
        <input type="text" id="newName" autocomplete="off">
        <button class="btn teal" id="addPerson" style="flex:none"></button>
      </div>
      <div class="hint" id="l_peopleHint"></div>
    </div>

      <h2><span id="l_members"></span> <span class="rule"></span></h2>

      <div class="fsum" id="fSum"></div>

    <div class="card">
      <h2><span id="l_expList"></span> <span class="rule"></span><span class="tag" id="totalTag"></span></h2>
      <div id="expList"></div>
    </div>
  </section>

  <!-- ---- تسویه ---- -->
  <section id="tab-settle" class="hidden"><div id="settleBody"></div></section>
</div>

<div id="sheetHost"></div>

<script>
"use strict";
/* ==================================================================
   Bilingual string table
   ================================================================== */
const STR = {
  fa: {
    brand: ["دنگ", "‌پاش"], brandSub: "خرجِ جمعی، بی دردسر",
    tripsTagline: "هر سفر و دورهمی، حساب خودش را دارد.",
    newTrip: "یک سفر تازه", tripPh: "مثلاً: شمال ۱۴۰۵", create: "بزن بریم",

let lang = "fa";
const T = k => STR[lang][k];

/* ==================================================================
   Persistence
   ================================================================== */
const KEY = "dongpash.v3", OLD2 = "dong.v2", OLD1 = "dong.v1";
const Store = (() => {
  let mem = null;
  const read = k => { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } };
  return {
    load() { return read(KEY) || (mem ? JSON.parse(JSON.stringify(mem)) : null); },
    old() { return read(OLD2) || read(OLD1); },
    save(d) { mem = JSON.parse(JSON.stringify(d)); try { localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch (e) { return false; } }
  };
})();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

   Helpers
   ================================================================== */
const FA = "۰۱۲۳۴۵۶۷۸۹", AR = "٠١٢٣٤٥٦٧٨٩";
const toEn = s => String(s).replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => AR.indexOf(d));
const faNum = n => lang === "fa" ? String(n).replace(/\d/g, d => FA[+d]) : String(n);
function parseNum(s) { const n = parseFloat(toEn(s).replace(/[^\d.-]/g, "")); return isFinite(n) ? n : 0; }
function money(n) { const neg = n < 0; n = Math.abs(Math.round(n)); return (neg ? "−" : "") + n.toLocaleString("en-US"); }
const cur = n => money(n) + (T("currency") ? " " + T("currency") : "");
function groupInput(el) {
  el.addEventListener("input", () => {
    const raw = toEn(el.value).replace(/[^\d]/g, "");
    el.value = raw ? Number(raw).toLocaleString("en-US") : "";
  });
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

   Animation helpers
   ================================================================== */
const REDUCED = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function ripple(e) {
  const el = e.currentTarget;
  if (REDUCED()) return;
  const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height);
  const s = document.createElement("span");
  s.className = "rip";
  s.style.width = s.style.height = d + "px";
  s.style.left = (e.clientX - r.left - d / 2) + "px";
  s.style.top = (e.clientY - r.top - d / 2) + "px";
  el.appendChild(s);
  setTimeout(() => s.remove(), 640);
}
function bindRipples(root) {
  (root || document).querySelectorAll(".btn,.trip,.chip,.iconbtn").forEach(el => {
    if (el._rip) return; el._rip = 1; el.addEventListener("pointerdown", ripple);
  });
}
let io = null;
function revealIn(root) {
  if (!io) io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("seen"); io.unobserve(e.target); }
  }), { rootMargin: "0px 0px -40px 0px" });
  (root || document).querySelectorAll(".reveal:not(.seen)").forEach(el => io.observe(el));
}
function runCounters(root) {
  root.querySelectorAll("[data-count]").forEach(el => {
    const target = +el.dataset.count, plain = el.dataset.plain, fa = el.dataset.fa;
    const fmt = v => plain ? (fa ? faNum(Math.round(v)) : String(Math.round(v))) : money(v);
    if (REDUCED() || !target) { el.textContent = fmt(target); return; }
    const dur = 850, t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(target * e);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function celebrate() {
  const c = $("#celebrate"); if (!c || REDUCED()) return;
  c.innerHTML = Array.from({ length: 22 }, (_, i) => {
    const s = 6 + Math.random() * 9 | 0;
    return `<b style="--dx:${(Math.random() * 300 - 150) | 0}px;--dy:${(100 + Math.random() * 150) | 0}px;
      --rot:${(Math.random() * 720 - 360) | 0}deg;animation-delay:${(i * .07).toFixed(2)}s;width:${s}px;height:${s}px"></b>`;
  }).join("");
}

const fltActive = () => flt.q || flt.payer || flt.part || flt.min || flt.max || flt.from || flt.to || flt.kind !== "all";
function filteredExpenses() {
  const t = trip(), q = flt.q.trim().toLowerCase();
  const qn = q ? toEn(q).replace(/[^\d]/g, "") : "";
  const min = flt.min ? parseNum(flt.min) : null, max = flt.max ? parseNum(flt.max) : null;
  const out = t.expenses.filter(e => {
    if (flt.kind === "normal" && e.kind === "settle") return false;
    if (flt.kind === "settle" && e.kind !== "settle") return false;
    if (flt.payer && e.payerId !== flt.payer) return false;
    if (flt.part && e.shares[flt.part] === undefined) return false;
    if (min !== null && e.amount < min) return false;
    if (max !== null && e.amount > max) return false;
    if (flt.from && (e.date || "") < flt.from) return false;
    if (flt.to && (e.date || "") > flt.to) return false;
    if (q) {
      const hay = [e.title, nameOf(e.payerId), ...Object.keys(e.shares).map(nameOf)].join(" ").toLowerCase();
      if (!hay.includes(q) && !(qn && String(e.amount).includes(qn))) return false;
    }
    return true;
  });
  const cmp = {
    new: (a, b) => (b.date || "").localeCompare(a.date || "") || t.expenses.indexOf(b) - t.expenses.indexOf(a),
    old: (a, b) => (a.date || "").localeCompare(b.date || "") || t.expenses.indexOf(a) - t.expenses.indexOf(b),
    big: (a, b) => b.amount - a.amount, small: (a, b) => a.amount - b.amount,
    az: (a, b) => String(a.title).localeCompare(String(b.title), lang)
  }[flt.sort] || (() => 0);
  return out.sort(cmp);
}

  r3.push([T2(T("xRow"), 2), T2(T("xTitle"), 2), T2(T("xDate"), 2), T2(T("xFrom"), 2), T2(T("xAmount"), 2),
  ...t.people.map(p => T2(T("xShareOf")(p.name), 2))]);
  t.expenses.forEach((e, i) => r3.push([N2(i + 1, 11), T2(e.title), T2(fmtDate(e.date), 11), T2(nameOf(e.payerId), 11), N2(e.amount),
  ...t.people.map(p => e.shares[p.id] ? N2(e.shares[p.id]) : T2("", 3))]));
  r3.push([T2("", 5), T2(T("total"), 5), T2("", 5), T2("", 5), { v: total, s: 6, t: "n" },
  ...t.people.map(p => ({ v: s.share[p.id], s: 6, t: "n" }))]);

  download(buildXlsx([
    { name: T("xSummary"), rows: r1, widths: [22, 16, 16, 16, 12, 13], rtl },
    { name: T("xSettle"), rows: r2, widths: [7, 20, 20, 18], rtl },
    { name: T("xExpenses"), rows: r3, widths: [7, 26, 15, 16, 15, ...t.people.map(() => 14)], rtl }
  ]), `${safeName(t.name)}.xlsx`);
  toast(T("tXlsx"));
}

/* ==================================================================
   Printable report
   ================================================================== */
function printReport() {
  const t = trip(), s = settlement();
  const total = t.expenses.reduce((a, e) => a + e.amount, 0);
  const n = v => `<td class="n">${money(v)}</td>`;
  const rowsPeople = t.people.map(p => {
    const v = s.net[p.id];
    return `<tr><td>${esc(p.name)}</td>${n(s.paid[p.id])}${n(s.share[p.id])}
      <td class="n ${v > 0 ? "pr-red" : (v < 0 ? "pr-green" : "")}">${money(Math.abs(v))}</td>
      <td class="n">${esc(v > 0 ? T("debtor") : (v < 0 ? T("creditor") : T("settled")))}</td></tr>`;
  }).join("");
  const rowsTx = s.tx.length ? s.tx.map((x, i) => `<tr><td class="n">${faNum(i + 1)}</td>
      <td>${esc(nameOf(x.from))}</td><td>${esc(nameOf(x.to))}</td>${n(x.amount)}</tr>`).join("")
    : `<tr><td colspan="4" style="text-align:center;padding:12px">${esc(T("prNoTx"))}</td></tr>`;
  const rowsExp = t.expenses.length ? t.expenses.map((e, i) => `<tr>
      <td class="n">${faNum(i + 1)}</td><td>${esc(e.title)}</td><td class="n">${esc(fmtDate(e.date))}</td>
      <td class="n">${esc(nameOf(e.payerId))}</td>${n(e.amount)}
      <td style="font-size:8.5pt;color:#69788C">${Object.entries(e.shares).map(([id, v]) => esc(nameOf(id)) + " " + money(v)).join(" · ")}</td></tr>`).join("")
    : `<tr><td colspan="6" style="text-align:center;padding:12px">${esc(T("prNoExp"))}</td></tr>`;

  $("#printRoot").innerHTML = `
  <div class="pr-head">
    <div><h1>${esc(t.name)}</h1><div style="font-size:9pt;color:#69788C">${esc(T("prTitle"))}</div></div>
    <div class="meta">${esc(T("prDate"))}: ${esc(fmtDate(todayISO()))}<br>
      ${esc(T("persons")(t.people.length))} · ${esc(T("expCount")(t.expenses.length))}</div>
  </div>
  <div class="pr-stats">
    <div class="pr-stat"><div class="v">${money(total)}</div><div class="l">${esc(T("stTotal"))}</div></div>
    <div class="pr-stat"><div class="v">${money(t.people.length ? total / t.people.length : 0)}</div><div class="l">${esc(T("stAvg"))}</div></div>
    <div class="pr-stat"><div class="v">${faNum(s.tx.length)}</div><div class="l">${esc(T("xTxN"))}</div></div>
  </div>
  <div class="pr-sec"><h2><span class="num">${faNum(1)}</span>${esc(T("perPerson"))}</h2>
  <table class="pr"><thead><tr><th>${esc(T("xName"))}</th><th>${esc(T("paid"))}</th><th>${esc(T("shareOfTrip"))}</th><th>${esc(T("xNet"))}</th><th>${esc(T("xStatus"))}</th></tr></thead>
  <tbody>${rowsPeople}</tbody>
  <tfoot><tr class="total"><td>${esc(T("total"))}</td><td class="n">${money(total)}</td><td class="n">${money(total)}</td><td class="n">0</td><td></td></tr></tfoot></table>
  <div class="pr-note">${T("netNote").replace(/<\/?b>/g, "")}</div></div>

  <div class="pr-sec"><h2><span class="num">${faNum(2)}</span>${esc(T("prWho"))}</h2>
  <table class="pr"><thead><tr><th style="width:8%">${esc(T("xRow"))}</th><th>${esc(T("xFrom"))}</th><th>${esc(T("xTo"))}</th><th>${esc(T("xAmount"))}</th></tr></thead>
  <tbody>${rowsTx}</tbody></table>
  <div class="pr-note">${esc(s.custom ? T("prNoteCustom") : T("prNoteAuto"))}</div></div>

  <div class="pr-sec"><h2><span class="num">${faNum(3)}</span>${esc(T("xDetail"))}</h2>
  <table class="pr"><thead><tr><th style="width:7%">${esc(T("xRow"))}</th><th>${esc(T("xTitle"))}</th><th>${esc(T("xDate"))}</th><th>${esc(T("xFrom"))}</th><th>${esc(T("xAmount"))}</th><th style="width:30%">${esc(T("xShares"))}</th></tr></thead>
  <tbody>${rowsExp}</tbody></table></div>

  <div class="pr-foot"><span>${esc(T("madeWith"))}</span><span>${esc(t.name)}</span></div>`;
  setTimeout(() => window.print(), 60);
}
/* ==================================================================
   Navigation
   ================================================================== */
function setExpForm(open) {
  $("#expFormBody").classList.toggle("hidden", !open);
  $("#toggleExpForm").textContent = open ? T("expClose") : T("expOpen");
  $("#toggleExpForm").classList.toggle("filt-on", !open);
}
function openTrip(id) {
  curTripId = id; editingId = null; cache = null; planEdit = null;
  form = { participants: new Set(), mode: "equal", custom: {}, payerId: null };
  flt = { q: "", payer: "", part: "", min: "", max: "", from: "", to: "", kind: "all", sort: "new" };
  ["fq", "fMin", "fMax", "fFrom", "fTo"].forEach(i => $("#" + i).value = "");
  $("#fAdv").classList.add("hidden");
  delete $("#expFormBody").dataset.touched;
  $("#screenTrips").classList.add("hidden");
  const sc = $("#screenTrip");
  sc.classList.remove("hidden", "enter"); void sc.offsetWidth; sc.classList.add("enter");
  $("#expDate").value = todayISO();
  showTab("people");
  renderAll();
  window.scrollTo({ top: 0 });
}
function backHome() {
  curTripId = null; planEdit = null;
  $("#screenTrip").classList.add("hidden");
  const sc = $("#screenTrips");
  sc.classList.remove("hidden", "enter"); void sc.offsetWidth; sc.classList.add("enter");
  renderTrips();
  window.scrollTo({ top: 0 });
}
function showTab(name) {
  $$("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  ["people", "expenses", "settle"].forEach(t => $("#tab-" + t).classList.toggle("hidden", t !== name));
  moveTabIndicator(name);
  if (name === "settle") renderSettle();
  const sec = $("#tab-" + name);
  sec.classList.remove("enter"); void sec.offsetWidth; sec.classList.add("enter");
  revealIn(sec);
}
$$("nav.tabs button").forEach(b => b.onclick = () => { showTab(b.dataset.tab); window.scrollTo({ top: 0, behavior: "smooth" }); });
$("#btnBack").onclick = backHome;
$("#tripList").addEventListener("click", e => {
  const b = e.target.closest("[data-trip]");
  if (b) openTrip(b.dataset.trip);
});

/* ==================================================================
   Bottom sheet
   ================================================================== */
function sheet(html) {
  const host = $("#sheetHost");
  host.innerHTML = `<div class="sheet"><div class="box"><div class="grab"></div>${html}</div></div>`;
  host.querySelector(".sheet").addEventListener("click", e => { if (e.target.classList.contains("sheet")) closeSheet(); });
  bindRipples(host);
  return host;
}
function confirmSheet(title, note, onYes) {
  const host = sheet(`<h3 style="text-align:center;line-height:1.6">${esc(title)}</h3>
    ${note ? `<div class="note" style="margin:0 0 16px;text-align:center">${esc(note)}</div>` : ""}
    <div class="row"><button class="btn teal" id="cfYes">${esc(T("yes"))}</button>
      <button class="btn ghost" id="cfNo">${esc(T("no"))}</button></div>`);
  host.querySelector("#cfNo").onclick = closeSheet;
  host.querySelector("#cfYes").onclick = () => { closeSheet(); setTimeout(onYes, 190); };
}
function closeSheet() {
  const b = $("#sheetHost .box");
  if (!b) return;
  b.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(40px)", opacity: 0 }],
    { duration: 200, easing: "ease-in" }).onfinish = () => $("#sheetHost").innerHTML = "";
}

/* ==================================================================
   Avatar and cover picker
   ================================================================== */
function openAvatarPicker(kind, id) {
  const target = kind === "person" ? byId(id) : trip();
  const cur = kind === "person" ? (target.av || {}) : { photo: target.cover };
  const grid = Array.from({ length: AV_COUNT }, (_, i) =>
    `<button data-preset="${i}" class="${cur.preset === i ? "on" : ""}">${avatarSvg(i)}</button>`).join("");
  const host = sheet(`
    <h3>${esc(T("pickAvatar"))} — ${esc(kind === "person" ? target.name : target.name)}</h3>
    <div style="display:flex;justify-content:center;margin-bottom:14px">
      ${kind === "person" ? avatarHTML(target, "xl") : `<div class="av xl">${coverHTML(target)}</div>`}
    </div>
    <div class="tools" style="margin-bottom:14px">
      <button class="btn teal sm" id="avUpload">${esc(T("upload"))}</button>
      ${cur.photo ? `<button class="btn line sm danger" id="avRemove">${esc(T("removePhoto"))}</button>` : ""}
      <button class="btn ghost sm" id="avClose">${esc(T("close"))}</button>
    </div>
    <input type="file" id="avFile" accept="image/*" class="hidden">
    ${kind === "person" ? `<label class="f">${esc(T("presets"))}</label><div class="avpick">${grid}</div>` : ""}`);
  host.querySelector("#avClose").onclick = closeSheet;
  host.querySelector("#avUpload").onclick = () => host.querySelector("#avFile").click();
  host.querySelector("#avFile").addEventListener("change", e => {
    readImage(e.target.files[0], data => {
      if (kind === "person") target.av = { photo: data }; else target.cover = data;
      save(); closeSheet(); renderAll(); if (!curTripId) renderTrips();
    });
  });
  const rm = host.querySelector("#avRemove");
  if (rm) rm.onclick = () => {
    if (kind === "person") target.av = { preset: hash(target.id) % AV_COUNT }; else delete target.cover;
    save(); closeSheet(); renderAll(); if (!curTripId) renderTrips();
  };
  host.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
    target.av = { preset: +b.dataset.preset };
    host.querySelectorAll("[data-preset]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    host.querySelector(".av.xl").innerHTML = avatarSvg(+b.dataset.preset);
    save(); renderAll();
  });
}
$("#peopleList").addEventListener("click", e => {
  const av = e.target.closest("[data-avatar]");
  if (av) { openAvatarPicker("person", av.dataset.avatar); return; }
  const id = e.target.dataset && e.target.dataset.del;
  if (!id) return;
  const t = trip();
  const used = t.expenses.some(x => x.payerId === id || x.shares[id] !== undefined);
  if (used && !confirm(T("cfDelPerson")(nameOf(id)))) return;
  t.people = t.people.filter(p => p.id !== id);
  t.expenses = t.expenses.filter(x => x.payerId !== id);
  t.expenses.forEach(x => {
    if (x.shares[id] !== undefined) {
      delete x.shares[id];
      const ids = Object.keys(x.shares);
      if (ids.length) { const w = {}; ids.forEach(i => w[i] = 1); x.shares = splitByWeights(x.amount, ids, w); }
    }
  });
  t.expenses = t.expenses.filter(x => Object.keys(x.shares).length);
  form.participants.delete(id);
  delete t.plan;
  save(); renderAll();
});
$("#tripCover").onclick = () => openAvatarPicker("trip");

/* ==================================================================
   Trips
   ================================================================== */
function addTrip() {
  const n = $("#tripName").value.trim();
  if (!n) { toast(T("tNeedTripName")); return; }
  const t = { id: uid(), name: n, createdAt: todayISO(), people: [], expenses: [] };
  state.trips.unshift(t); $("#tripName").value = "";
  save(); renderTrips(); openTrip(t.id); toast(T("tTripMade"));
}
$("#addTrip").onclick = addTrip;
$("#tripName").addEventListener("keydown", e => { if (e.key === "Enter") addTrip(); });
$("#btnTripMenu").onclick = () => {
  const t = trip();
  const host = sheet(`<h3>${esc(T("tripSettings"))}</h3>
    <div class="field"><label class="f">${esc(T("tripNameL"))}</label><input type="text" id="renameIn" value="${esc(t.name)}"></div>
    <div class="row"><button class="btn teal" id="doRename">${esc(T("saveL"))}</button>
      <button class="btn ghost" id="closeSheet">${esc(T("close"))}</button></div>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <button class="btn line sm danger full" id="doDelTrip">${esc(T("delTrip"))}</button></div>`);
  host.querySelector("#closeSheet").onclick = closeSheet;
  host.querySelector("#doRename").onclick = () => {
    const v = host.querySelector("#renameIn").value.trim();
    if (v) { t.name = v; save(); renderTripHeader(); toast(T("tRenamed")); }
    closeSheet();
  };
  host.querySelector("#doDelTrip").onclick = () => {
    if (!confirm(T("cfDelTrip")(t.name))) return;
    state.trips = state.trips.filter(x => x.id !== t.id);
    save(); closeSheet(); backHome(); toast(T("tTripDel"));
  };
};

/* ==================================================================
   People
   ================================================================== */
function addPeople() {
  const raw = $("#newName").value.trim();
  if (!raw) { toast(T("tNeedName")); return; }
  const t = trip(); let added = 0;
  raw.split(/[,،\n]/).map(s => s.trim()).filter(Boolean).forEach(n => {
    if (t.people.some(p => p.name === n)) return;
    const id = uid();
    t.people.push({ id, name: n, av: { preset: (hash(id) + t.people.length * 7) % AV_COUNT } });
    added++;
  });
  $("#newName").value = "";
  save(); renderAll();
  toast(added ? T("tAdded")(added) : T("tDup"));
}
$("#addPerson").onclick = addPeople;
$("#newName").addEventListener("keydown", e => { if (e.key === "Enter") addPeople(); });

/* ==================================================================
   Expense form
   ================================================================== */
$("#partChips").addEventListener("click", e => {
  const btn = e.target.closest("[data-part]"); if (!btn) return;
  const id = btn.dataset.part;
  form.participants.has(id) ? form.participants.delete(id) : form.participants.add(id);
  if (form.mode === "weight" && !form.custom[id]) form.custom[id] = 1;
  renderForm();
});
$("#selAll").onclick = () => { trip().people.forEach(p => { form.participants.add(p.id); if (form.mode === "weight" && !form.custom[p.id]) form.custom[p.id] = 1; }); renderForm(); };
$("#selNone").onclick = () => { form.participants.clear(); renderForm(); };
$$("#modeSeg button").forEach(b => b.onclick = () => {
  form.mode = b.dataset.mode;
  if (form.mode === "weight") [...form.participants].forEach(i => { if (!form.custom[i]) form.custom[i] = 1; });
  renderForm();
});
groupInput($("#expAmount"));
$("#expAmount").addEventListener("input", () => { form.mode === "equal" ? renderEqualPreview() : updateTally(); });
$("#expPayer").addEventListener("change", e => form.payerId = e.target.value);
$("#toggleExpForm").onclick = () => { $("#expFormBody").dataset.touched = "1"; setExpForm($("#expFormBody").classList.contains("hidden")); };

function resetForm() {
  editingId = null;
  $("#expTitle").value = ""; $("#expAmount").value = ""; $("#expDate").value = todayISO();
  form.custom = {};
  $("#l_expFormTitle").textContent = T("expNew");
  $("#saveExp").textContent = T("expSave");
  $("#cancelEdit").classList.add("hidden");
}
$("#saveExp").onclick = () => {
  const t = trip();
  const title = $("#expTitle").value.trim() || T("expWhat");
  const amount = Math.round(parseNum($("#expAmount").value));
  const payer = $("#expPayer").value;
  const ids = [...form.participants];
  if (!t.people.length) { toast(T("tNeedPeople")); return; }
  if (amount <= 0) { toast(T("tBadAmount")); $("#expAmount").classList.add("err"); return; }
  $("#expAmount").classList.remove("err");
  if (!payer) { toast(T("tNeedPayer")); return; }
  if (!ids.length) { toast(T("tNeedPart")); return; }
  if (form.mode === "exact" && ids.reduce((a, i) => a + Math.round(form.custom[i] || 0), 0) !== amount) { toast(T("tSumMismatch")); return; }
  if (form.mode === "weight" && ids.reduce((a, i) => a + (form.custom[i] || 0), 0) <= 0) { toast(T("tNeedWeights")); return; }
  const shares = computeShares(amount, ids, form.mode, form.custom);
  const date = $("#expDate").value || todayISO();
  if (editingId) {
    Object.assign(t.expenses.find(x => x.id === editingId), { title, amount, payerId: payer, shares, date });
    toast(T("tExpEdited"));
  } else {
    t.expenses.push({ id: uid(), title, amount, payerId: payer, shares, date });
    toast(T("tExpSaved"));
  }
  resetForm(); save(); renderAll(); setExpForm(false);
  window.scrollTo({ top: 0, behavior: "smooth" });
};
$("#cancelEdit").onclick = () => { resetForm(); renderForm(); setExpForm(false); };
$("#expList").addEventListener("click", e => {
  const t = trip();
  const del = e.target.dataset && e.target.dataset.delx, ed = e.target.dataset && e.target.dataset.edit;
  if (del) {
    const card = e.target.closest(".exp");
    card.animate([{ opacity: 1 }, { opacity: 0, transform: "translateX(30px)" }], { duration: 220, easing: "ease-in" }).onfinish = () => {
      t.expenses = t.expenses.filter(x => x.id !== del);
      if (editingId === del) resetForm();
      save(); renderAll(); toast(T("tDeleted"));
    };
  }
  if (ed) {
    const x = t.expenses.find(y => y.id === ed); if (!x) return;
    editingId = ed;
    $("#expTitle").value = x.title;
    $("#expAmount").value = x.amount.toLocaleString("en-US");
    $("#expDate").value = x.date || todayISO();
    form.payerId = x.payerId;
    form.participants = new Set(Object.keys(x.shares));
    form.mode = "exact"; form.custom = {};
    Object.entries(x.shares).forEach(([i, v]) => form.custom[i] = v);
    $("#l_expFormTitle").textContent = T("expEdit");
    $("#saveExp").textContent = T("expSaveEdit");
    $("#cancelEdit").classList.remove("hidden");
    renderForm(); setExpForm(true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

/* ==================================================================
   Filters
   ================================================================== */
let fDeb = null;
const fRefresh = () => renderExpenses();
$("#toggleFilter").onclick = () => {
  const a = $("#fAdv"); a.classList.toggle("hidden");
  $("#toggleFilter").textContent = a.classList.contains("hidden") ? T("filters") : T("filtersClose");
};
$("#fq").addEventListener("input", e => { flt.q = e.target.value; clearTimeout(fDeb); fDeb = setTimeout(fRefresh, 130); });
$("#fClearQ").onclick = () => { flt.q = ""; $("#fq").value = ""; fRefresh(); };
groupInput($("#fMin")); groupInput($("#fMax"));
[["fPayer", "payer"], ["fPart", "part"], ["fSort", "sort"], ["fKind", "kind"]].forEach(([el, k]) =>
  $("#" + el).addEventListener("change", e => { flt[k] = e.target.value; fRefresh(); }));
[["fMin", "min"], ["fMax", "max"], ["fFrom", "from"], ["fTo", "to"]].forEach(([el, k]) =>
  $("#" + el).addEventListener("input", e => { flt[k] = e.target.value; clearTimeout(fDeb); fDeb = setTimeout(fRefresh, 130); }));
$("#fReset").onclick = () => {
  flt = { q: "", payer: "", part: "", min: "", max: "", from: "", to: "", kind: "all", sort: "new" };
  ["fq", "fMin", "fMax", "fFrom", "fTo"].forEach(i => $("#" + i).value = "");
  $("#fPayer").value = ""; $("#fPart").value = ""; $("#fSort").value = "new"; $("#fKind").value = "all";
  fRefresh(); toast(T("tFiltersCleared"));
};

/* ==================================================================
   Backup
   ================================================================== */
$("#btnExport").onclick = () => {
  download(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }), "dongpash-" + todayISO() + ".json");
  toast(T("tBackup"));
};
$("#btnImport").onclick = () => $("#fileIn").click();
$("#fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      let inc = [];
      if (Array.isArray(d.trips)) inc = d.trips;
      else if (Array.isArray(d.people)) inc = [{ id: uid(), name: "restored", createdAt: todayISO(), people: d.people, expenses: d.expenses || [] }];
      else throw 0;
      if (!confirm(T("cfImport")(inc.length))) state.trips = inc;
      else inc.forEach(t => state.trips.push({ ...t, id: uid() }));
      state.trips.forEach(t => t.people.forEach(p => { if (!p.av) p.av = { preset: hash(p.id) % AV_COUNT }; }));
      cache = null; save(); backHome(); toast(T("tRestored"));
    } catch (err) { toast(T("tBadFile")); }
  };
  r.readAsText(f); e.target.value = "";
});

/* ==================================================================
   Language and theme
   ================================================================== */
$$("#langSeg button,#langSeg2 button").forEach(b => b.onclick = () => {
  if (lang === b.dataset.lang) return;
  lang = b.dataset.lang; state.lang = lang; Store.save(state);
  const w = document.querySelector(".screen:not(.hidden)");
  if (w && !REDUCED()) w.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 130, easing: "ease-in" })
    .onfinish = () => { applyLang(); w.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 300, easing: "cubic-bezier(.22,1,.36,1)" }); };
  else applyLang();
});
$$(".themebtn").forEach(b => b.onclick = () => {
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
  Store.save(state);
});

/* ==================================================================
   Boot
   ================================================================== */
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(() => {});
try { localStorage.setItem("dp.probe", "1"); localStorage.removeItem("dp.probe"); }
catch (e) { $("#storageNote").dataset.warn = "1"; $("#storageNote").textContent = STR.fa.bkNoStore; }

lang = state.lang || "fa";
setTheme(state.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
applyLang();
bindRipples();
revealIn();
save();
</script>
